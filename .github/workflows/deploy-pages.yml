name: Deploy Bakery WS

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "pricing.html"
      - "features.html"
      - "how-it-works.html"
      - "for-bakers.html"
      - "calculator.html"
      - "styles.css"
      - "site-pages.css"
      - "site-fixes.css"
      - "script.js"
      - "calculator.js"
      - "app/index.html"
      - "app/styles.css"
      - "core.js"
      - "store.js"
      - "auth.js"
      - "app.js"
      - "config.js"
      - ".nojekyll"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bakery-ws-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare marketing site and app artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/app

          cp index.html pricing.html features.html how-it-works.html for-bakers.html calculator.html \
             styles.css site-pages.css site-fixes.css script.js calculator.js .nojekyll _site/

          cp app/index.html app/styles.css core.js store.js auth.js app.js config.js _site/app/

          test -f _site/index.html
          test -f _site/pricing.html
          test -f _site/styles.css
          test -f _site/site-pages.css
          test -f _site/script.js
          test -f _site/app/index.html
          test -f _site/app/styles.css
          test -f _site/app/core.js
          test -f _site/app/auth.js
          test -f _site/app/config.js

          grep -q 'SIMPLE PRICING' _site/index.html
          grep -q 'Start small.' _site/index.html
          grep -q 'pricing-page-grid' _site/index.html
          grep -q 'MOST POPULAR' _site/index.html
          grep -q '\$19' _site/index.html
          grep -q 'Before you choose.' _site/index.html
          grep -q 'pricing-page-grid' _site/site-pages.css

          grep -q 'Bakery WS' _site/app/index.html
          grep -q 'authForm' _site/app/index.html
          grep -q 'resendConfirmationBtn' _site/app/index.html
          grep -q 'data-view="profit"' _site/app/index.html
          grep -q 'orderFinancials' _site/app/core.js
          grep -q '/Bakery-WS/app/' _site/app/config.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public pricing homepage and app
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          success=0
          for attempt in $(seq 1 18); do
            home="$(curl -fsSL --max-time 20 "$SITE_URL" || true)"
            pricing_css="$(curl -fsSL --max-time 20 "${SITE_URL%/}/site-pages.css" || true)"
            app_home="$(curl -fsSL --max-time 20 "${SITE_URL%/}/app/" || true)"
            app_core="$(curl -fsSL --max-time 20 "${SITE_URL%/}/app/core.js?v=1" || true)"

            if printf '%s' "$home" | grep -q 'SIMPLE PRICING' \
              && printf '%s' "$home" | grep -q 'Start small.' \
              && printf '%s' "$home" | grep -q 'MOST POPULAR' \
              && printf '%s' "$home" | grep -q '\$19' \
              && printf '%s' "$home" | grep -q 'Before you choose.' \
              && printf '%s' "$pricing_css" | grep -q 'pricing-page-grid' \
              && printf '%s' "$app_home" | grep -q 'Bakery WS' \
              && printf '%s' "$app_home" | grep -q 'authForm' \
              && printf '%s' "$app_home" | grep -q 'Know what you earn' \
              && printf '%s' "$app_core" | grep -q 'orderFinancials'; then
              success=1
              break
            fi

            echo "Bakery WS pricing site/app not ready yet (attempt $attempt/18)."
            sleep 10
          done

          if [ "$success" -ne 1 ]; then
            echo "Public Bakery WS pricing site/app smoke test failed: $SITE_URL" >&2
            exit 1
          fi
